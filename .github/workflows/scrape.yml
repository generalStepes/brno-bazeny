name: Scrape pool availability

on:
  schedule:
    # Every hour, at :17 rather than :00 - GitHub Actions heavily queues/
    # delays runs scheduled for the top of the hour since that's the most
    # congested cron time across all of GitHub; off-the-hour minutes get
    # scheduled much more reliably.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-pool-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref, not the default (the SHA at trigger time) - with the
      # concurrency group below, a queued run can sit for several minutes
      # before actually starting, during which an earlier run may have
      # already pushed a fresh update. Checking out main fresh here (rather
      # than the stale triggering SHA) is what lets the recency check below
      # actually see that update and skip the redundant work.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check time since last update
        id: recency
        run: |
          # The native hourly schedule and the external ~30min cron-job.org
          # trigger sometimes land within seconds of each other (GitHub
          # delays/queues schedule triggers unpredictably, per the comment
          # above). Every successful run pushes a commit regardless of
          # whether pool data actually changed, since latest.json embeds a
          # generatedAt timestamp - so back-to-back runs each push, and each
          # push kicks off its own GitHub Pages deployment. Overlapping
          # deployments fail outright ("in progress deployment") rather than
          # queuing, which can leave the live site stuck on stale data until
          # someone notices and manually retries. Skip the (expensive)
          # scrape+push entirely if another run just updated things, so
          # near-duplicate triggers collapse into one.
          last=$(node -pe "require('./docs/data/latest.json').generatedAt")
          last_epoch=$(date -d "$last" +%s)
          now_epoch=$(date -u +%s)
          age=$((now_epoch - last_epoch))
          echo "last update was ${age}s ago"
          if [ "$age" -lt 600 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.recency.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.recency.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        if: steps.recency.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: steps.recency.outputs.skip != 'true'
        run: npm run scrape

      - name: Commit updated data
        if: steps.recency.outputs.skip != 'true'
        run: |
          git config user.name "pool-availability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json docs/data/occupancy-history.json docs/images/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update pool availability data"
          # Now that runs can be triggered every ~30min from an external cron
          # (GitHub's own schedule trigger is unreliable) as well as manual
          # dispatches, overlapping runs can race to push. Retry with rebase,
          # preferring our just-scraped data over whatever else touched the
          # same files, since it's the freshest snapshot either way.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest and retrying..."
            git fetch origin main
            git rebase -X ours origin/main
            sleep $((RANDOM % 10 + 1))
          done
          echo "::error::Failed to push after retries"
          exit 1
