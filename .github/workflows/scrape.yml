name: Scrape pool availability

on:
  schedule:
    # Every hour, at :17 rather than :00 - GitHub Actions heavily queues/
    # delays runs scheduled for the top of the hour since that's the most
    # congested cron time across all of GitHub; off-the-hour minutes get
    # scheduled much more reliably.
    - cron: '17 * * * *'
  workflow_dispatch: {}
  # Code changes on main redeploy the site straight away (with the latest
  # data from the `data` branch) instead of waiting for the next scrape.
  push:
    branches: [main]

permissions:
  contents: write # force-push the single-commit `data` branch
  pages: write
  id-token: write

# Serializes runs, so the `data` branch force-push below and the Pages
# deployments never race each other.
concurrency:
  group: scrape-pool-data
  cancel-in-progress: false

# Generated data is deliberately NOT committed to main. It used to be (every
# ~30 min: latest.json + two webcam JPEGs), which grew the repository by
# several MB a day. Instead:
#   - the site is deployed straight from this workflow as a Pages artifact
#     (Settings -> Pages -> Source: GitHub Actions), and
#   - the only state that has to survive between runs (occupancy-history.json,
#     plus latest.json and the webcam stills for code-only redeploys) lives
#     on the `data` branch as a
#     single commit that is force-pushed every run, so it never accumulates
#     history.
jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous data
        run: |
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x
          else
            echo "::warning::No data branch yet - starting with empty history"
          fi

      - name: Check time since last update
        id: recency
        run: |
          # The native hourly schedule and the external ~30min cron-job.org
          # trigger sometimes land within seconds of each other (GitHub
          # delays/queues schedule triggers unpredictably). Skip the
          # (expensive) scrape if another run just did it. Pushes to main
          # always deploy (with whatever data we have) so code changes go
          # live immediately.
          skip=false
          if [ -f docs/data/latest.json ]; then
            last=$(node -pe "require('./docs/data/latest.json').generatedAt")
            age=$(( $(date -u +%s) - $(date -d "$last" +%s) ))
            echo "last update was ${age}s ago"
            [ "$age" -lt 600 ] && skip=true
          fi
          [ "${{ github.event_name }}" = "push" ] && skip=true
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.recency.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.recency.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        if: steps.recency.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: steps.recency.outputs.skip != 'true'
        run: npm run scrape

      - name: Save data to the data branch
        if: steps.recency.outputs.skip != 'true'
        run: |
          git config user.name "pool-availability-bot"
          git config user.email "actions@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          # Webcam stills ride along so a code-only (push) deploy still has
          # the images latest.json points to.
          git add -f docs/data/latest.json docs/data/occupancy-history.json $(ls -d docs/images 2>/dev/null)
          commit=$(git commit-tree "$(git write-tree)" -m "Pool data snapshot")
          git push -f origin "$commit:refs/heads/data"

      - uses: actions/configure-pages@v5
        if: steps.recency.outputs.skip != 'true' || github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v3
        if: steps.recency.outputs.skip != 'true' || github.event_name == 'push'
        with:
          path: docs

      # deploy-pages sometimes queries the artifact API before the upload
      # above is visible ("Found 0 artifact(s)") and fails; a delayed retry
      # succeeds, so try once more instead of leaving the site stale for a run.
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.recency.outputs.skip != 'true' || github.event_name == 'push'
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
